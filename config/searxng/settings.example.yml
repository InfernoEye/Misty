# Copy to settings.yml and replace this placeholder with a new local random secret.
# The real settings.yml is intentionally excluded from Git.
use_default_settings: true

server:
  bind_address: "127.0.0.1"
  port: 8080
  secret_key: "__GENERATE_LOCAL_SECRET__"
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  formats:
    - html
    - json

engines:
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false
  - name: mojeek
    disabled: false
